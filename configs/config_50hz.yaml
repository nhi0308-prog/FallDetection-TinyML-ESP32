source_hz: 100
target_hz: 50
window_samples: 100
stride_samples: 10
channels:
- AccX
- AccY
- AccZ
- GyrX
- GyrY
- GyrZ
subject_split: configs/subject_split.json
label_mapping: configs/label_mapping.yaml
fall_min_seconds_after_onset: 0.2
fall_max_seconds_after_impact: 0.3
resampling:
  method: causal_butterworth_then_decimate
  filter_order: 8
  cutoff_hz: 20
  keep_even_source_frames: true
